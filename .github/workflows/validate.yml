name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-compose-and-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Vulkan profile env file
        run: cp profiles/gfx803-vulkan.env .env

      - name: Validate Docker Compose config
        run: docker compose config > /tmp/compose.resolved.yaml

      - name: Build Vulkan smoke target
        run: docker compose build vulkan-smoke

      - name: Build Vulkan Frigate target
        run: docker compose build frigate-vulkan
