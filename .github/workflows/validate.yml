name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-compose-and-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate shell and detector source
        run: |
          bash -n docker/scripts/build_ncnn_wheel.sh \
            docker/scripts/install_python311.sh \
            scripts/build.sh \
            scripts/export_ncnn_model.sh \
            scripts/validate_vulkan.sh
          python3 -m py_compile docker/frigate/ncnn.py

      - name: Validate Docker Compose config
        run: docker compose --env-file profiles/gfx803-vulkan.env config --quiet

      - name: Build Vulkan smoke target
        run: docker compose --env-file profiles/gfx803-vulkan.env build vulkan-smoke

      - name: Build Vulkan Frigate target
        run: docker compose --env-file profiles/gfx803-vulkan.env build frigate-vulkan
