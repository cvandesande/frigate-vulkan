services:
  vulkan-smoke:
    image: rocm-legacy/vulkan-smoke:${PROFILE_NAME}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: vulkan-smoke
      args:
        NCNN_TAG: ${NCNN_TAG}
    environment:
      PROFILE_NAME: ${PROFILE_NAME}
      NCNN_FP16: ${NCNN_FP16:-0}
    devices:
      - /dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}
    volumes:
      - ./models:/models:ro

  frigate-vulkan:
    image: rocm-legacy/frigate:${PROFILE_NAME}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frigate-vulkan
      args:
        NCNN_TAG: ${NCNN_TAG}
        FRIGATE_IMAGE: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:0.17.2}
    environment:
      PROFILE_NAME: ${PROFILE_NAME}
    devices:
      - /dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}
    volumes:
      - ./config:/config
      - ./models:/models
